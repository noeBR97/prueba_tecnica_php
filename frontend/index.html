<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de reservas - Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Panel de Gestión de Reservas</h1>

        <!-- mensajes visuales de éxito, error y cargando -->
         <div id="feedback-alert" class="alert d-none"></div>
         <div id="loading-spinner" class="spinner d-none">Cargando...</div>

         <!-- sección tabla con filtros -->
          <div class="card">
            <h3>Filtrar reservas</h3>
            <div class="filter-container">
                <input type="text" id="filtro-nombre" placeholder="Buscar por huésped...">
                <select id="filtro-estado">
                    <option value="">Todos los estados</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmada">Confirmada</option>
                    <option value="cancelada">Cancelada</option>
                </select>
                <div class="date-filter-group">
                    <label class="small-label">Desde:</label>
                    <input type="date" id="filtro-fecha-entrada">
                </div>
                <div class="date-filter-group">
                    <label class="small-label">Hasta:</label>
                    <input type="date" id="filtro-fecha-salida">
                </div>
                <button id="btn-filtrar" class="btn">Filtrar</button>
                <button id="btn-limpiar" class="btn btn-secondary">Limpiar</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Huésped</th>
                            <th>Email Huésped</th>
                            <th>Alojamiento</th>
                            <th>Fechas</th>
                            <th>Importe</th>
                            <th>Estado</th>
                            <th>Notas</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-reservas-body">

                    </tbody>
                </table>
            </div>
          </div>

          <!-- sección crear reserva -->
           <div class="card">
            <h3>Crear Nueva Reserva</h3>
            <form id="form-crear-reserva">
                <div class="form-grid">
                    <input type="text" id="nombre_huesped" placeholder="Nombre Huésped" required>
                    <input type="email" id="email_huesped" placeholder="Email Huésped" required>
                    <input type="text" id="nombre_alojamiento" placeholder="Nombre Alojamiento" required>
                    <input type="date" id="fecha_entrada" placeholder="Fecha de entrada" required>
                    <input type="date" id="fecha_salida" placeholder="Fecha de salida" required>
                    <input type="number" step="0.01" id="importe" placeholder="Importe (€)" required>
                </div>
                <button type="submit" class="btn btn-success">Guardar Reserva</button>
            </form>
           </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
